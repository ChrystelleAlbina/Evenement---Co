<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Activités</title>
</head>

<body>
    <header>
        <div class="hotel">
            <img src="image evenementiel & Co/hotel-Baobab-in-the-biological-r.webp"
                aria-label="photo image hotel Baobab en bois" alt="photo image hotel Baobab en bois" max-width="100%"
                height="140px">
        </div>
        <div class="logoEvent">
            <img src="image evenementiel & Co/logo.webp" aria-label="logo hotel evenement & Co"
                alt="logo hotel evenement & Co" width="54px" height="54px">
        </div>
        <nav class="navbar">
            <div class="menu-icon"></div>

            <!-- checkbox pour contrôler le menu -->
            <input id="menu-toggle" type="checkbox" class="menu-checkbox" />

            <!-- label pour icone svg -->
            <label for="menu-toggle" class="menu-icon" aria-label="ouvrir le menu">
                <svg width="30" height="30" viewBox="0 0 100 80" fill="black">
                    <rect width="100" height="10"></rect>
                    <rect y="30" width="100" height="10"></rect>
                    <rect y="30" width="100" height="10"></rect>
                </svg>
            </label>

            <!--  fond semi transparent -->
            <div class="overlay"></div>

            <!-- Menu de navigation -->
            <ul class="nav-links">
                <li><a href="Index.html">Index</a></li>
                <li><a href="Activités.html">Activités</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="titleActivites">
            <h1> Activités</h1>
        </div>

        <div class="activites-container">
            <div class="activite">
                <img src="image evenementiel & Co/accrobranche.webp" alt="Accrobranche" aria-label="Accrobranche">
                <p>Accrobranche, mur d'escalade, parcours VTT</p>
            </div>

            <div class="activite">
                <img src="image evenementiel & Co/Sentier.webp" alt="sentier dans la foret"
                    aria-label="Sentier dans la forêt">
                <p>Sentier, observation des animaux</p>
            </div>

            <div class="activite">
                <img src="image evenementiel & Co/cheminee.webp" alt="cheminée" aria-label="Cheminée">
                <p>Zone de repos, cheminée, bibliothèque</p>
            </div>

            <div class="titleActivites">
                <h1>Restauration</h1>
            </div>
            <div class="activite">
                <img src="image evenementiel & Co/panier-de-saison_-mini-légumes.webp"
                    alt="panier-de-saison_-mini-légumes" aria-label="Panier de saison avec mini-légumes">
                <p>Cuisine locale et de saison</p>
            </div>

            <div class="activite">
                <img src="image evenementiel & Co/Planche-Apéro-_-Idées-et-Recettes-pour-Créer-des….webp"
                    alt="Planche-Apéro-_-Idées-et-Recettes-pour-Créer-des…"
                    aria-label="Planche apéro avec idées et recettes">
                <p>Légumes de jardin bio</p>
            </div>
            <div class="activite">
                <img src="image evenementiel & Co/repas.webp" alt="plateau de charcuterie"
                    aria-label="Plateau de charcuterie">
                <p>Produit de partenairs locaux. Viande, oeuf, volailles</p>
            </div>
        </div>
    </main>

</body>

</html>
