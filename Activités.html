<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Activités</title>
</head>

<body>
    <header>
        <div class="hotel">
            <link rel="preload" as="image" href="image evenementiel & Co/Hotel baobab.webp">

            <img src="image evenementiel & Co/Hotel baobab.webp" aria-label="Photo de l'hôtel Baobab en bois"
                alt="Photo de l'hôtel Baobab en boisloat" loading="eager">
        </div>

        <div class="logoEvent">
            <img src="image evenementiel & Co/logo.webp" aria-label="logo hotel evenement & Co"
                alt="logo hotel evenement & Co" loading="lazy">
        </div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="Index.html">Accueil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Activités.html">Activités</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Contact.html">Contact</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <h1 class="titleActivites">Activités</h1>

        <div class="activites-container">
            <div class="activite">
                <img src="image evenementiel & Co/accrobranche.webp" alt="Accrobranche" aria-label="Accrobranche" loading="lazy">
                <p>Accrobranche, mur d'escalade, parcours VTT</p>
            </div>

            <div class="activite">
                <img src="image evenementiel & Co/Sentier.webp" alt="sentier dans la foret"
                    aria-label="Sentier dans la forêt" loading="lazy">
                <p>Sentier, observation des animaux</p>
            </div>

            <div class="activite">
                <img src="image evenementiel & Co/cheminee.webp" alt="cheminée" aria-label="Cheminée" loading="lazy">
                <p>Zone de repos, cheminée, bibliothèque</p>
            </div>

            <h1 class="titleActivites">Restauration</h1>
            <div class="activite">
                <img src="image evenementiel & Co/panier-de-saison_-mini-légumes.webp"
                    alt="panier-de-saison_-mini-légumes" aria-label="Panier de saison avec mini-légumes" loading="lazy">
                <p>Cuisine locale et de saison</p>
            </div>

            <div class="activite">
                <img src="image evenementiel & Co/Planche-Apéro-_-Idées-et-Recettes-pour-Créer-des….webp"
                    alt="Planche-Apéro-_-Idées-et-Recettes-pour-Créer-des…"
                    aria-label="Planche apéro avec idées et recettes" loading="lazy">
                <p>Légumes de jardin bio</p>
            </div>
            <div class="activite">
                <img src="image evenementiel & Co/repas.webp" alt="plateau de charcuterie"
                    aria-label="Plateau de charcuterie" loading="lazy">
                <p>Produit de partenairs locaux. Viande, oeuf, volailles</p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
