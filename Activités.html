<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Activités</title>
</head>
<body>
    <header>
        <div class="hotel">
            <img src="image evenementiel & Co/hotel-Baobab-in-the-biological-r.webp"
                aria-label="photo image hotel Baobab en bois" alt="photo image hotel Baobab en bois" max-width="100%"
                height="140px">
        </div>
        <div class="logo">
            <img src="image evenementiel & Co/logo.webp" aria-label="logo hotel evenement & Co"
                alt="logo hotel evenement & Co" width="54px" height="54px">
        </div>
        <div class="menuBurger">
            <a href="menuBurger.html"><img src="image evenementiel & Co/menu-burger-horizontal-svgrepo-com.svg"
                    aria-label="menu" alt="menu" height="20vh"></a>
        </div>
    </header>
   <main>
    <div class="titleActivites">
        <h1> Activités</h1>
    </div>

    <div class="activites-container">
        <div class="activite">
            <img src="image evenementiel & Co/accrobranche.webp" alt="Accrobranche" aria-label="Accrobranche">
            <p>Accrobranche, mur d'escalade, parcours VTT</p>
        </div>

        <div class="activite">
            <img src="image evenementiel & Co/Sentier.webp" alt="sentier dans la foret" aria-label="Sentier dans la forêt">
            <p>Sentier, observation des animaux</p>
        </div>

        <div class="activite">
            <img src="image evenementiel & Co/cheminee.webp" alt="cheminée" aria-label="Cheminée">
            <p>Zone de repos, cheminée, bibliothèque</p>
        </div>

        <div class="titleActivites">
        <h1>Restauration</h1>
    </div>
        <div class="activite">
            <img src="image evenementiel & Co/panier-de-saison_-mini-légumes.webp" alt="panier-de-saison_-mini-légumes"
                aria-label="Panier de saison avec mini-légumes">
            <p>Cuisine locale et de saison</p>
        </div>

        <div class="activite">
            <img src="image evenementiel & Co/Planche-Apéro-_-Idées-et-Recettes-pour-Créer-des….webp" alt="Planche-Apéro-_-Idées-et-Recettes-pour-Créer-des…" aria-label="Planche apéro avec idées et recettes">
            <p>Légumes de jardin bio</p>
        </div>
        <div class="activite">
            <img src="image evenementiel & Co/repas.webp" alt="plateau de charcuterie" aria-label="Plateau de charcuterie">
            <p>Produit de partenairs locaux. Viande, oeuf, volailles</p>
        </div>
    </div>
</main>

</body>
</html>
