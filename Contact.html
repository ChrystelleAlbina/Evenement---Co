<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preload" as="image" href="imageEvenementiel/HotelBaobab.webp">
     <link rel="preload" as="image" href="imageEvenementiel/logo.webp">
    <title>Contact</title>
</head>

<body>
    <header>
        <div class="hotel">
            <img src="imageEvenementiel/HotelBaobab.webp" loading="eager" fetchpriority="high"
                aria-label="Photo de l'hôtel Baobab en bois" alt="Photo de l'hôtel Baobab en boisloat">
        </div>

        <div class="logoEvent">
            <img src="imageEvenementiel/logo.webp" aria-label="logo hotel evenement & Co"
                alt="logo hotel evenement & Co" loading="lazy">
        </div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="Index.html">Accueil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Activités.html">Activités</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Contact.html">Contact</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>

    </header>
    <main>
        <div class="InfoContact">
            <p>
                Vous souhaitez nous contacter ? <br>voir des informations, réserver une date, le formulaire de contact
                est à votre disposition. Vous avez la possibilité de venir sur place afin de nous rencontrer et visiter
                les lieux.
            </p>
        </div>
        <form class="formContact">
            <input class="input" type="text" placeholder="Nom">
            <input class="input" type="text" placeholder="E-Mail">
            <textarea class="textarea" placeholder="Message"></textarea>
            <center><button class="button">Envoyer</button></center>
        </form>

    </main>
    <footer>
        <div class="footerContact">
            <img src="imageEvenementiel/Handicap.webp" alt="LOGO PMR " aria-label="LOGO PMR" loading="lazy">
            <img src="imageEvenementiel/Recyclage.webp" alt="logo recyclage" aria-label="logo recyclage" loading="lazy">
            <img src="imageEvenementiel/no-motor-vehicles.webp" alt="Logo voiture interdite"
                aria-label="Logo voiture interdite" loading="lazy">
            <img src="imageEvenementiel/facebook.webp" alt="logo Facebook" aria-label="logo Facebook" max-width="40px"
                height="40px" loading="lazy">
            <img src="imageEvenementiel/instagram.webp" alt="logo Instagram" aria-label="logo Instagram"
                max-width="40px" height="40px" loading="lazy">
            <img src="imageEvenementiel/compost.webp" alt="compost" aria-label="compost" max-width="40px" height="40px"
                loading="lazy">
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
